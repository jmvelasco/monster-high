name: "🚀 Architecture Deployment Gate"

on:
  push:
    branches: [ main ] # Se dispara de forma determinista al consolidar código aquí

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    environment: Production # 🛡️ Forzar la pausa síncrona (HITL) en el servidor

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Instalar dependencias del Monorepo
      run: npm ci

    - name: 🚀 Desplegar en Vercel (Solo post-aprobación humana)
      run: npx vercel deploy --prod --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}